name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Show APK info
        run: |
          ls -lah build/app/outputs/flutter-apk/app-debug.apk
          echo "APK size: $(du -h build/app/outputs/flutter-apk/app-debug.apk | cut -f1)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Boxpower-Flow-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      - name: Upload to VPS
        continue-on-error: true
        run: |
          curl -s -X POST \
            "https://ultraflow.boxpower.store/admin/upload-apk?token=65cc2f5f61be9da4" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@build/app/outputs/flutter-apk/app-debug.apk" \
            --max-time 180 \
            -w "\nHTTP: %{http_code}\n" && echo "Upload VPS OK" || echo "Upload VPS falhou (não crítico)"
