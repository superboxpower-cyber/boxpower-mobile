name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Show environment
        run: |
          flutter --version
          java -version
          echo "ANDROID_HOME: $ANDROID_HOME"
          echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
          ls $ANDROID_HOME/build-tools/ 2>/dev/null | tail -3

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          flutter build apk --debug --no-tree-shake-icons
          echo "=== APK output ==="
          find . -name "*.apk" -not -path "*/.gradle/*" 2>/dev/null
          ls -lah build/app/outputs/flutter-apk/ 2>/dev/null || echo "No flutter-apk dir"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Boxpower-Flow-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      - name: Upload to VPS
        continue-on-error: true
        run: |
          curl -s -X POST \
            "https://ultraflow.boxpower.store/admin/upload-apk?token=65cc2f5f61be9da4" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@build/app/outputs/flutter-apk/app-debug.apk" \
            --max-time 180 \
            -w "\nHTTP: %{http_code}\n" && echo "Upload VPS OK" || echo "Upload VPS falhou"
