workflows:
  ios-workflow:
    name: Boxpower iOS Build
    max_build_duration: 120
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up Flutter
        script: |
          flutter packages pub get
      - name: Build and Sign iOS App
        script: |
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos
          cp ../../../ios/Runner/embedded.mobileprovision Runner.app/embedded.mobileprovision
          codesign -s - --deep --force Runner.app
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r Boxpower-iOS.ipa Payload
          cp Boxpower-iOS.ipa ../../../
    artifacts:
      - Boxpower-iOS.ipa
      - build/ios/iphoneos/*.ipa
      - build/ios/iphoneos/*.app

  android-workflow:
    name: Boxpower Android APK
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Set up Flutter
        script: |
          flutter packages pub get
      - name: Build Android APK
        script: |
          flutter build apk --debug
          echo "=== APK files found: ==="
          find . -name "*.apk" -not -path "*/cache/*" 2>/dev/null
          cp build/app/outputs/flutter-apk/app-debug.apk Boxpower-Android.apk 2>/dev/null || \
          cp $(find . -name "*.apk" -not -path "*/cache/*" | head -1) Boxpower-Android.apk 2>/dev/null || \
          echo "APK not found"
    artifacts:
      - Boxpower-Android.apk
      - build/app/outputs/**/*.apk
