workflows:
  ios-workflow:
    name: Boxpower iOS Build
    max_build_duration: 120
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up Flutter
        script: |
          flutter packages pub get
      - name: Build and Sign iOS App
        script: |
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos
          cp ../../../ios/Runner/embedded.mobileprovision Runner.app/embedded.mobileprovision
          codesign -s - --deep --force Runner.app
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r Boxpower-iOS.ipa Payload
          cp Boxpower-iOS.ipa ../../../
    artifacts:
      - Boxpower-iOS.ipa
      - build/ios/iphoneos/*.ipa
      - build/ios/iphoneos/*.app

  android-workflow:
    name: Boxpower Android APK
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Build Android APK
        script: |
          flutter packages pub get
          flutter build apk --debug
          APK=$(find . -name "app-debug.apk" | head -1)
          echo "APK encontrado em: $APK"
          echo "Enviando para VPS..."
          curl -s -X POST \
            "https://ultraflow.boxpower.store/admin/upload-apk?token=65cc2f5f61be9da4" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@$APK" \
            && echo "Upload para VPS: OK"
    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
