name: flow_multilogin_mobile
description: "Secure Session Injection mobile app for Flow Multilogin using Flutter."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # WebView control and native cookie injection
  flutter_inappwebview: ^6.1.5
  
  # API Http Communication
  http: ^1.2.0
  
  # Local storage for saving JWT authentication tokens
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
